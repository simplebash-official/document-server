services:
  document-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: simplebash-official/document-server:latest
    container_name: document-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY (e.g. export INTERNAL_API_KEY=$(openssl rand -hex 32))}
      - DATABASE_URL=sqlite:///app/data/document_server.db
      - APP_ENV=production
      - ALLOW_PRIVATE_IP_IMAGES=false
      - RUST_LOG=document_server=info,tower_http=info,info
    volumes:
      - document_data:/app/data
      # Published template packages (POST /api/packages) live under
      # /app/templates/packages; they must survive a container recreate.
      - document_packages:/app/templates/packages
      # Uncomment to mount templates/fonts for live editing without image rebuild
      # (or mount an assemble-templates.sh output dir to use your own designs).
      # Keep it read-only for documents/, labels/ and lib/ only: mount those
      # three subfolders individually, not the whole templates/ directory,
      # because packages/ above is a writable volume nested inside it.
      # - ./templates/documents:/app/templates/documents:ro
      # - ./templates/labels:/app/templates/labels:ro
      # - ./templates/lib:/app/templates/lib:ro
      # - ./fonts:/app/fonts:ro

volumes:
  document_data:
  document_packages:
